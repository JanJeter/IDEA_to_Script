name: ${RESTORE_PROJECT_NAME:?Set RESTORE_PROJECT_NAME in the restore-only env file}

services:
  postgres-restore:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_USER: ${RESTORE_POSTGRES_USER:?Set RESTORE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RESTORE_POSTGRES_PASSWORD:?Set RESTORE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RESTORE_POSTGRES_DB:?Set RESTORE_POSTGRES_DB ending in _restore}
    labels:
      com.idea2screenplay.restore-target: idea2screenplay-isolated-restore-v1
    volumes:
      - restore_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [restore_internal]

  api-restore:
    image: ${RESTORE_API_IMAGE:?Set the immutable API image used in production}
    restart: "no"
    profiles: [api]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${RESTORE_POSTGRES_USER}:${RESTORE_POSTGRES_PASSWORD}@postgres-restore:5432/${RESTORE_POSTGRES_DB}?schema=public
      API_PORT: 3000
      WEB_ORIGIN: https://127.0.0.1
      COOKIE_SIGNING_KEY: ${RESTORE_COOKIE_SIGNING_KEY:?Set a restore-only random key}
      VISITOR_IDENTITY_KEY: ${RESTORE_VISITOR_IDENTITY_KEY:?Set a different restore-only random key}
      IP_HASH_KEY: ${RESTORE_IP_HASH_KEY:?Set a different restore-only random key}
      ALTCHA_HMAC_KEY: ${RESTORE_ALTCHA_HMAC_KEY:?Set a different restore-only random key}
      VISITOR_COOKIE_SECURE: "true"
      ACCESS_CONTROL_REQUIRED: "true"
      APP_ACCESS_CODES: ${RESTORE_APP_ACCESS_CODE:?Set a restore-only access code}
      DEMO_MODE: "true"
      LLM_API_KEY: ""
      RESTORE_VERIFY_MODE: "true"
      GENERATION_CONCURRENCY: 1
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 96
    labels:
      com.idea2screenplay.restore-api: idea2screenplay-isolated-api-v1
    depends_on:
      postgres-restore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [restore_internal]

volumes:
  restore_data:
    name: ${RESTORE_VOLUME_NAME:?Set an explicit volume name containing restore}

networks:
  restore_internal:
    name: ${RESTORE_NETWORK_NAME:?Set an explicit network name containing restore}
    internal: true
