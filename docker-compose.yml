name: idea2screenplay-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: screenwriter
      POSTGRES_PASSWORD: screenwriter
      POSTGRES_DB: idea2screenplay
    ports:
      - "5433:5432"
    volumes:
      - idea2screenplay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screenwriter -d idea2screenplay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  idea2screenplay_pgdata:
