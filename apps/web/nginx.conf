user root;
worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;

    location = /healthz { add_header Content-Type text/plain; return 200 "ok\n"; }
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/8.130.170.254/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.130.170.254/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;

    location = /healthz { add_header Content-Type text/plain; return 200 "ok\n"; }

    location ^~ /api/ {
      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 120s;
    }

    location ^~ /assets/ {
      root /srv;
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
      root /srv;
      try_files $uri /index.html;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
  }
}
